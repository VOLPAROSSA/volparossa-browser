name: Firefox address-bar suggestion privacy
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - defaults/privacy.json
      - integration/search-suggestions.py
      - scripts/stage_firefox.py
      - scripts/smoke_privacy.py
      - .github/workflows/search-suggestions.yml
permissions:
  contents: read
jobs:
  address-bar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Stage the official Firefox build and project defaults
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 120 -o "$RUNNER_TEMP/firefox.tar.xz" \
            https://archive.mozilla.org/pub/firefox/releases/157.0.1/linux-x86_64/en-US/firefox-157.0.1.tar.xz
          echo "0d92bf39cdd174f5f361008509310bdefbce72a57ca10523a43b32d62dc699b6  $RUNNER_TEMP/firefox.tar.xz" | sha256sum --check
          tar xf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          python3 -B scripts/stage_firefox.py --firefox "$RUNNER_TEMP/firefox/firefox" \
            --expected-version 157.0.1 --expected-source-stamp 47c5f402c8d3a5369f1fb1b6cd61b0bb92725af1 \
            --output build/firefox --without-extensions
      - name: Type before submission and inspect the selected suggestion provider
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/search-proof"
          mkdir -m 0700 "$RUNNER_TEMP/search-proof/appdata"
          sudo bwrap --die-with-parent --unshare-net --unshare-pid --ro-bind / / --tmpfs /tmp --dev /dev --proc /proc \
            --tmpfs "$HOME" --ro-bind "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" \
            --bind "$RUNNER_TEMP/search-proof" "$RUNNER_TEMP/search-proof" \
            --bind "$RUNNER_TEMP/search-proof/appdata" "$HOME/.mozilla" --chdir "$GITHUB_WORKSPACE" \
            --uid "$(id -u)" --gid "$(id -g)" --cap-drop ALL \
            python3 -I -B integration/search-suggestions.py "$GITHUB_WORKSPACE/build/firefox" "$RUNNER_TEMP/search-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firefox-search-suggestions
          path: ${{ runner.temp }}/search-proof/suggestions.json
          if-no-files-found: error
