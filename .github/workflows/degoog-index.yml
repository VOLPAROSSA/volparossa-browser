name: DeGoog public index recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/degoog-index.yml
      - integration/degoog/**
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: degoog-org/degoog
          ref: 1f7d2f172aad3ed5e5a69aa227b384573203742c
          path: upstream-degoog
          persist-credentials: false
      - name: Extract the three enrolled public documents
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8878ed9c21e647184309c360d89289891b275216
          mkdir "$RUNNER_TEMP/enrolled"
          git archive 8878ed9c21e647184309c360d89289891b275216 \
            docs/BUNDLED_EXTENSIONS.md docs/CORE_INTEGRATION.md docs/FIREFOX_PROVENANCE.md \
            | tar -x -C "$RUNNER_TEMP/enrolled"
      - name: Stage pinned Bun and locked DeGoog dependencies
        run: bash integration/degoog/stage.sh upstream-degoog
      - name: Search the restored public index with the producer offline
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/degoog-public"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            python3 -I -B integration/degoog/trial.py "$RUNNER_TEMP/bun-linux-x64/bun" \
            "$GITHUB_WORKSPACE/upstream-degoog" "$RUNNER_TEMP/enrolled/docs" \
            "$RUNNER_TEMP/degoog-public/index.db" | tee "$RUNNER_TEMP/degoog-public/degoog-result.json"
      - name: Check the separate consumer entry point on the exported bytes
        run: |
          set -euo pipefail
          sha=$(jq -er .snapshot_sha256 "$RUNNER_TEMP/degoog-public/degoog-result.json")
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            python3 -I -B integration/degoog/trial.py --peer-snapshot "$RUNNER_TEMP/bun-linux-x64/bun" \
            "$GITHUB_WORKSPACE/upstream-degoog" "$RUNNER_TEMP/degoog-public/index.db" "$sha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: degoog-public-index
          path: |
            ${{ runner.temp }}/degoog-public/index.db
            ${{ runner.temp }}/degoog-public/degoog-result.json
          if-no-files-found: error
