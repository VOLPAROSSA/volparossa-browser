name: DeGoog public index recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/degoog-index.yml
      - integration/degoog/**
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: degoog-org/degoog
          ref: 1f7d2f172aad3ed5e5a69aa227b384573203742c
          path: upstream-degoog
          persist-credentials: false
      - name: Extract the three enrolled public documents
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8878ed9c21e647184309c360d89289891b275216
          mkdir "$RUNNER_TEMP/enrolled"
          git archive 8878ed9c21e647184309c360d89289891b275216 \
            docs/BUNDLED_EXTENSIONS.md docs/CORE_INTEGRATION.md docs/FIREFOX_PROVENANCE.md \
            | tar -x -C "$RUNNER_TEMP/enrolled"
      - name: Stage pinned Bun and locked DeGoog dependencies
        working-directory: upstream-degoog
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1f7d2f172aad3ed5e5a69aa227b384573203742c
          curl --fail --location --retry 2 --max-time 90 --output "$RUNNER_TEMP/bun.zip" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          echo "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  $RUNNER_TEMP/bun.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bun.zip" bun-linux-x64/bun -d "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/bun-linux-x64/bun" --version)" = 1.4.4
          "$RUNNER_TEMP/bun-linux-x64/bun" install --frozen-lockfile --ignore-scripts
          git diff --exit-code
          cp ../integration/degoog/public-index.ts volparossa-index.ts
      - name: Search the restored public index with the producer offline
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            python3 -I -B integration/degoog/trial.py "$RUNNER_TEMP/bun-linux-x64/bun" \
            "$GITHUB_WORKSPACE/upstream-degoog" "$RUNNER_TEMP/enrolled/docs" | tee "$RUNNER_TEMP/degoog-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: degoog-public-index
          path: ${{ runner.temp }}/degoog-result.json
          if-no-files-found: error
